<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hacked By TurkHackTeam</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body{margin:0;background:#030000;color:#fff;font-family:sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0.6}
        .box{z-index:10;text-align:center;background:rgba(10,0,0,0.8);padding:30px;border:1px solid #ff003c;box-shadow:0 0 30px rgba(255,0,0,0.3)}
        .logo{width:180px;filter:drop-shadow(0 0 15px red);animation:g 3s infinite}
        h1{font-family:'Orbitron',sans-serif;font-size:1.8rem;margin-top:20px;color:#ff003c;text-shadow:0 0 10px red}
        @keyframes g{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="box">
        <img src="https://i.hizliresim.com/9x1hxd2.png" class="logo">
        <h1>SYSTEM OVERRIDDEN<br>BY TURKHACKTEAM</h1>
    </div>
    <script>
        const c=document.getElementById("c"),ctx=c.getContext("2d");
        c.width=window.innerWidth;c.height=window.innerHeight;
        const s="アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",f=16,col=c.width/f,y=Array(Math.floor(col)).fill(1);
        function d(){
            ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle="#ff003c";ctx.font=f+"px monospace";
            y.forEach((v,i)=>{
                ctx.fillText(s[Math.floor(Math.random()*s.length)],i*f,v*f);
                if(v*f>c.height&&Math.random()>0.975)y[i]=0;y[i]++;
            });
        }
        setInterval(d,35);
    </script>
</body>
</html>
